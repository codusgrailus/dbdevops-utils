databaseChangeLog:
  - changeSet:
      id: 1
      author: dbdevopsuser01
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: products
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: stock_quantity
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: is_available
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP

  - changeSet:
      id: 2
      author: dbdevopsuser01
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: orders
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: customer_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: customer_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: order_date
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP

  - changeSet:
      id: 3
      author: dbdevopsuser01
      preConditions:
        - onFail: MARK_RAN
          not:
            - columnExists:
                tableName: products
                columnName: sku
      changes:
        - addColumn:
            tableName: products
            columns:
              - column:
                  name: sku
                  type: VARCHAR(100)

  - changeSet:
      id: 4
      author: dbdevopsuser01
      preConditions:
        - onFail: MARK_RAN
          not:
            - columnExists:
                tableName: orders
                columnName: shipping_address
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: shipping_address
                  type: VARCHAR(500)

  - changeSet:
      id: 5
      author: dbdevopsuser01
      changes:
        - insert:
            tableName: products
            columns:
              - column:
                  name: name
