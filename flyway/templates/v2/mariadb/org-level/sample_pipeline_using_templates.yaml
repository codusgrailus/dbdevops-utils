pipeline:
  name: TemplateTestNov20_v01
  identifier: TemplateTestNov20_v01
  projectIdentifier: dbdproj01
  orgIdentifier: senthilorg01
  tags: {}
  stages:
    - stage:
        name: PrepareDatabasesStage
        identifier: PrepareDatabasesStage
        tags: {}
        template:
          templateRef: org.FirstTimeSetupStage
          versionLabel: v1
          templateInputs:
            type: Custom
            variables:
              - name: dbSchema
                type: String
                value: <+pipeline.variables.dbSchema>
              - name: databaseInstanceList
                type: String
                value: <+pipeline.variables.databaseInstanceList>
              - name: maxMatrixConcurrency
                type: Number
                value: <+pipeline.variables.maxMatrixConcurrency>
              - name: kubernetesConnectorRef
                type: String
                value: <+pipeline.variables.kubernetesConnectorRef>
              - name: dockerImageConnectorRef
                type: String
                value: <+pipeline.variables.dockerImageConnectorRef>
              - name: enableBaseline
                type: String
                value: <+pipeline.variables.enableBaseline>
    - stage:
        name: PreviewAndApproveStage
        identifier: PreviewAndApproveStage
        tags: {}
        template:
          templateRef: org.PreviewAndApproveStage
          versionLabel: v1
          templateInputs:
            type: Custom
            variables:
              - name: dbSchema
                type: String
                value: <+pipeline.variables.dbSchema>
              - name: databaseInstanceList
                type: String
                value: <+pipeline.variables.databaseInstanceList>
              - name: maxMatrixConcurrency
                type: Number
                value: <+pipeline.variables.maxMatrixConcurrency>
              - name: kubernetesConnectorRef
                type: String
                value: <+pipeline.variables.kubernetesConnectorRef>
              - name: dockerImageConnectorRef
                type: String
                value: <+pipeline.variables.dockerImageConnectorRef>
              - name: enableManualApproval
                type: String
                value: <+pipeline.variables.enableManualApproval>
    - stage:
        name: ApplyOrRollbackStage
        identifier: ApplyOrRollbackStage
        tags: {}
        template:
          templateRef: org.ApplyOrRollbackStage
          versionLabel: v1
          templateInputs:
            type: Custom
            variables:
              - name: dbSchema
                type: String
                value: <+pipeline.variables.dbSchema>
              - name: k8sConnectorRef
                type: String
                value: <+pipeline.variables.kubernetesConnectorRef>
              - name: dockerImageConnectorRef
                type: String
                value: <+pipeline.variables.dockerImageConnectorRef>
              - name: databaseInstanceList
                type: String
                value: <+pipeline.variables.databaseInstanceList>
  variables:
    - name: dbSchema
      type: String
      description: Flyway DB Schema
      required: true
      value: <+input>
    - name: databaseInstanceList
      type: String
      description: Comma-separated database instances
      required: true
      value: <+input>
    - name: maxMatrixConcurrency
      type: Number
      description: Maximum parallel database operations
      required: true
      value: <+input>
    - name: kubernetesConnectorRef
      type: String
      description: Kubernetes connector
      required: true
      value: <+input>
    - name: dockerImageConnectorRef
      type: String
      description: Docker image connector
      required: true
      value: <+input>
    - name: enableBaseline
      type: String
      description: Enable baseline only for verified unmanaged databases
      required: true
      value: <+input>.default(false)
    - name: enableManualApproval
      type: String
      description: Require manual approval before apply or rollback
      required: true
      value: <+input>.default(true)
